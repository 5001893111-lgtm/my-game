<style>
/* Layout: satu kolom. Peta pelayaran berbentuk SVG vertikal dengan enam pulau berkelok; pulau dan pos dibuka sebagai layar bergantian di tempat yang sama. Tampilan malam dipilih sengaja. */
:root {
  --bg: #0a1b2b;
  --sea: #0f2b44;
  --sea-2: #163a59;
  --foam: #eaf4f8;
  --dim: #93b2c4;
  --line: #27506f;
  --gold: #ffc83d;
  --gold-ink: #241a00;
  --good: #6fe0a0;
  --miss: #f4a3ad;
  --t-laut: #4aa3e8;
  --t-angkasa: #9b8cf2;
  --t-hutan: #4cc388;
  --t-tubuh: #f07b8e;
  --t-hewan: #f2a24d;
  --t-bumi: #3cc7bf;
  --font-display: "Lilita One", "Trebuchet MS", sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--foam);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.55;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: clamp(2.8rem, 10vw, 4.2rem); color: var(--gold); }
h2 { font-size: 2.2rem; }
h3 { font-size: 1.7rem; }
p { margin: 0; }
.lead { color: var(--dim); margin-top: 8px; max-width: 54ch; }
.muted { color: var(--dim); }

.top { display: flex; flex-direction: column; gap: 18px; }
.hud { display: flex; flex-wrap: wrap; gap: 10px 32px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat small { font-size: .75rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.stat strong { font-family: var(--font-display); font-weight: 400; font-size: 1.8rem; line-height: 1.15; font-variant-numeric: tabular-nums; }
#h-stars { color: var(--gold); }

.btn {
  font-family: var(--font-body); font-weight: 700; font-size: 1rem; min-height: 46px; padding: 8px 18px;
  border: 2px solid var(--gold); border-radius: 12px; background: var(--gold); color: var(--gold-ink); cursor: pointer;
}
.btn:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; color: var(--foam); border-color: var(--line); }
.btn:disabled { opacity: .5; cursor: default; filter: none; }
.btn:focus-visible, .opt:focus-visible, .node:focus-visible, h2:focus-visible, h3:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* Peta */
.map-wrap { background: var(--sea); border-radius: 20px; padding: 12px 8px; box-shadow: 0 0 0 2px var(--line); }
#map { width: 100%; max-width: 460px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.node { cursor: pointer; }
.node.locked { cursor: not-allowed; }
.node text { font-family: var(--font-body); }
.node .num { font-family: var(--font-display); }

/* Pulau */
.view { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.pos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.pos li { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.pos-n { font-family: var(--font-display); font-size: 1.6rem; width: 36px; color: var(--tc); }
.pos-t { flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; }
.pos-t strong { font-size: 1.1rem; }
.pos-t small { color: var(--dim); font-size: .9rem; }
.pos-t small.ok { color: var(--gold); font-weight: 700; }
.pos-t small.miss { color: var(--miss); }

/* Pos */
.card { background: var(--sea); border-radius: 20px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 2px var(--line); min-width: 0; }
.card .eyebrow { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.card .title { color: var(--tc); }
.fact-text { font-size: clamp(1.2rem, 4.2vw, 1.5rem); line-height: 1.4; font-weight: 700; max-width: 40ch; }
.why { background: var(--sea-2); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; max-width: 60ch; }
.why strong { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; }
.qtext { font-size: clamp(1.2rem, 4.2vw, 1.5rem); font-weight: 700; line-height: 1.35; max-width: 40ch; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { min-height: 52px; text-align: left; padding: 10px 16px; font: inherit; font-weight: 700; color: var(--foam); background: var(--sea-2); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--tc); }
.opt:disabled { cursor: default; opacity: 1; }
.opt.right { border-color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }
.opt.wrong { border-style: dashed; color: var(--dim); }
.res { font-family: var(--font-display); font-size: 1.6rem; }
.res.ok { color: var(--gold); }
.res.no { color: var(--miss); }
.foot { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--dim); font-size: .9rem; }
.link { background: none; border: 0; padding: 8px 0; min-height: 44px; font: inherit; color: var(--dim); text-decoration: underline; cursor: pointer; }
.link:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

#toast {
  position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 24px); opacity: 0; pointer-events: none;
  background: var(--foam); color: var(--bg); padding: 12px 18px; border-radius: 14px; width: max-content; max-width: calc(100% - 32px); font-weight: 700; text-align: center;
  transition: opacity .2s, transform .2s; z-index: 20;

#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 420px) { .card { padding: 18px 16px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

      var a = NODES[i], b = NODES[i + 1], ym = (a.y + b.y) / 2;
      var open = unlocked(i + 1);
      s += '<path d="M' + a.x + " " + a.y + " C" + a.x + " " + ym + " " + b.x + " " + ym + " " + b.x + " " + b.y + '" fill="none" stroke="' +
        (open ? "var(--gold)" : "var(--line)") + '" stroke-width="' + (open ? 4 : 3) + '" stroke-linecap="round"' + (open ? "" : ' stroke-dasharray="2 10"') + "/>";
    }
    ORDER.forEach(function (t, i) {
      var n = NODES[i], open = unlocked(i), got = starsOf(t), col = "var(" + TOPICS[t].c + ")";
      var label = "Pulau " + TOPICS[t].name + ", " + got + " dari 4 bintang" + (open ? "" : ", terkunci");
      s += '<g class="node' + (open ? "" : " locked") + '" data-act="island" data-t="' + t + '" role="button" tabindex="0" aria-label="' + esc(label) + '"' + (open ? "" : ' aria-disabled="true"') + ">";
      s += '<circle cx="' + n.x + '" cy="' + n.y + '" r="40" fill="' + (open ? col : "var(--sea-2)") + '" stroke="' + (open ? "var(--foam)" : "var(--line)") + '" stroke-width="3"' + (open ? "" : ' stroke-dasharray="6 6"') + "/>";
      if (open) {
        s += '<text class="num" x="' + n.x + '" y="' + (n.y + 11) + '" text-anchor="middle" font-size="32" fill="#0a1b2b">' + (i + 1) + "</text>";
      } else {
        s += '<g transform="translate(' + n.x + " " + (n.y + 2) + ')"><rect x="-10" y="-2" width="20" height="15" rx="3" fill="var(--dim)"/><path d="M-6 -2 V-8 a6 6 0 0 1 12 0 V-2" fill="none" stroke="var(--dim)" stroke-width="3"/></g>';
      }
      if (got === 4) s += '<path transform="translate(' + n.x + " " + (n.y - 52) + ')" d="M-13 0 L-9 -13 L0 -5 L9 -13 L13 0Z" fill="var(--gold)"/>';
      s += '<text x="' + n.x + '" y="' + (n.y + 64) + '" text-anchor="middle" font-size="17" font-weight="700" fill="' + (open ? "var(--foam)" : "var(--dim)") + '">' + esc(TOPICS[t].name) + "</text>";
      for (var k = 0; k < 4; k++) {
        var sx = n.x - 30 + k * 20, sy = n.y + 82;
        s += '<polygon points="' + starPts(sx, sy, 8) + '" ' + (k < got ? 'fill="var(--gold)" stroke="var(--gold)"' : 'fill="none" stroke="var(--dim)"') + ' stroke-width="1.5" stroke-linejoin="round"/>';
      }
      s += "</g>";
    });
    $("map").innerHTML = s;
    $("reset-area").innerHTML = V.confirmReset
      ? 'Hapus semua bintang? <button class="link" type="button" data-act="reset-yes" data-key="reset-yes">Ya, hapus</button> <button class="link" type="button" data-act="reset-no" data-key="reset-no">Batal</button>'
      : '<button class="link" type="button" data-act="reset" data-key="reset">Mulai dari awal</button>';
  }

  function renderHud() {
    var n = totalStars();
    $("h-stars").textContent = n + "/" + FACTS.length;
    $("h-rank").textContent = rankFor(n);
  }

  /* Layar pulau */
  function renderIsland() {
    var t = V.topic, list = topicFacts(t), got = starsOf(t), i = ORDER.indexOf(t);
    var nextName = i < ORDER.length - 1 ? TOPICS[ORDER[i + 1]].name : null;
    var h = '<div><button class="btn ghost" type="button" data-act="back-map" data-key="back-map">Kembali ke peta</button></div>' +
      '<div style="--tc:var(' + TOPICS[t].c + ')"><h2 id="view-h" tabindex="-1" style="color:var(--tc)">Pulau ' + esc(TOPICS[t].name) + "</h2>" +
      '<p class="lead">' + got + " dari 4 bintang." + (nextName ? (got >= NEED ? " Pulau " + esc(nextName) + " sudah terbuka." : " Kumpulkan " + NEED + " bintang untuk membuka Pulau " + esc(nextName) + ".") : " Ini pulau terakhir.") + "</p></div>" +
      '<ol class="pos" style="--tc:var(' + TOPICS[t].c + ')">';
    list.forEach(function (f, k) {
      var st = statusOf(f.id);
      var info = st === "ok" ? '<small class="ok">Bintang didapat</small>' : st === "miss" ? '<small class="miss">Jawabanmu belum tepat. Coba lagi besok.</small>' : "<small>Belum dijawab</small>";
      h += '<li><span class="pos-n">' + (k + 1) + '</span><div class="pos-t"><strong>' + esc(f.title) + "</strong>" + info + "</div>" +
        '<button class="btn' + (st === "open" ? "" : " ghost") + '" type="button" data-act="start" data-id="' + f.id + '" data-key="start-' + f.id + '">' + (st === "open" ? "Mulai pos" : "Baca lagi") + "</button></li>";
    });
    $("v-island").innerHTML = h + "</ol>";
  }

  /* Layar pos */
  function renderStage() {
    var f = FACT_BY_ID[V.id], t = f.t, list = topicFacts(t), idx = list.indexOf(f), st = statusOf(f.id), q = QS[f.id];
    var h = '<div><button class="btn ghost" type="button" data-act="back-island" data-key="back-island">Kembali ke pulau</button></div>' +
      '<article class="card" style="--tc:var(' + TOPICS[t].c + ')">' +
      '<p class="eyebrow">Pulau ' + esc(TOPICS[t].name) + " &middot; pos " + (idx + 1) + " dari " + list.length + "</p>";
    if (V.step === "read") {
      h += '<h3 id="view-h" tabindex="-1" class="title">' + esc(f.title) + '</h3><p class="fact-text">' + esc(f.text) + "</p>";
      if (V.why) h += '<div class="why"><strong>Kenapa begitu?</strong><p>' + esc(f.why) + "</p></div>";
      h += '<div class="btn-row"><button class="btn ghost" type="button" data-act="why" data-key="why">' + (V.why ? "Sembunyikan penjelasan" : "Kenapa begitu?") + "</button>";
      if (st === "open") h += '<button class="btn" type="button" data-act="test" data-key="test">Aku siap dites</button>';
      h += "</div>";
      if (st === "ok") h += '<p class="muted">Bintang pos ini sudah kamu dapat.</p>';
      if (st === "miss") h += '<p class="muted">Jawabanmu di pos ini belum tepat hari ini. Baca lagi baik-baik, besok kamu bisa mencoba lagi.</p>';
    } else {
      h += '<h3 id="view-h" tabindex="-1" class="title">Tes pos: ' + esc(f.title) + '</h3><p class="qtext">' + esc(q.q) + '</p><div class="opts">';
      V.order.forEach(function (oi, k) {
        var cls = "opt", mark = "";
        if (V.picked !== null) {
          if (oi === q.a) { cls += " right"; mark = " (benar)"; }
          else if (k === V.picked) { cls += " wrong"; mark = " (pilihanmu)"; }
        }
        h += '<button class="' + cls + '" type="button" data-act="answer" data-o="' + k + '" data-key="opt-' + k + '"' + (V.picked !== null ? " disabled" : "") + ">" + esc(q.o[oi] + mark) + "</button>";
      });
      h += "</div>";
      if (V.picked !== null) {
        h += '<p class="res ' + (V.right ? "ok" : "no") + '">' + (V.right ? "Tepat! +1 bintang" : "Belum tepat. Tidak ada bintang.") + "</p>" +
          '<div class="why"><strong>Kenapa begitu?</strong><p>' + esc(f.why) + "</p></div>";
        var more = idx < list.length - 1;
        h += '<div class="btn-row">' + (more ? '<button class="btn" type="button" data-act="next" data-key="next">Pos berikutnya</button>' : "") +
          '<button class="btn ' + (more ? "ghost" : "") + '" type="button" data-act="back-island" data-key="done">Kembali ke pulau</button></div>';
      }
    }
    $("v-stage").innerHTML = h + "</article>";
  }

  function renderAll() {
    renderHud();
    $("v-map").hidden = V.view !== "map";
    $("v-island").hidden = V.view !== "island";
    $("v-stage").hidden = V.view !== "stage";
    if (V.view === "map") renderMap();
    if (V.view === "island") renderIsland();
    if (V.view === "stage") renderStage();
    if (focusHeading) {
      var hd = $("view-h");
      if (hd) hd.focus();
      focusHeading = false;
    } else if (focusKey) {
      var el = document.querySelector('[data-key="' + focusKey + '"]');
      if (el && !el.disabled) el.focus();
    }
    focusKey = null;
  }

  var toastTimer = 0;
  function toast(msg) {
    var el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove("show"); }, 3800);
  }
  function go(view) { V.view = view; V.confirmReset = false; focusHeading = view !== "map"; window.scrollTo(0, 0); }

  var actions = {
    island: function (b) {
      var t = b.dataset.t, i = ORDER.indexOf(t);
      if (!unlocked(i)) { toast("Pulau ini masih terkunci. Kumpulkan " + NEED + " bintang di pulau sebelumnya."); return; }
      V.topic = t; go("island");
    },
    "back-map": function () { go("map"); },
    "back-island": function () { V.topic = FACT_BY_ID[V.id] ? FACT_BY_ID[V.id].t : V.topic; go("island"); },
    start: function (b) { V.id = b.dataset.id; V.step = "read"; V.why = false; V.picked = null; go("stage"); },
    why: function () { V.why = !V.why; focusKey = "why"; },
    test: function () {
      if (statusOf(V.id) !== "open") return;
      V.step = "q"; V.order = shuffle([0, 1, 2]); V.picked = null; V.right = false; focusHeading = true;
    },
    answer: function (b) {
      if (V.picked !== null || statusOf(V.id) !== "open") return;
      var f = FACT_BY_ID[V.id], q = QS[V.id], k = +b.dataset.o;
      V.picked = k;
      V.right = V.order[k] === q.a;
      var before = starsOf(f.t);
      if (V.right) {
        S.stars[V.id] = { s: "ok" };
        toast("Tepat! Kamu dapat 1 bintang.");
        var ti = ORDER.indexOf(f.t);
        if (before < NEED && starsOf(f.t) >= NEED && ti < ORDER.length - 1) toast("Pulau " + TOPICS[ORDER[ti + 1]].name + " terbuka!");
      } else {
        S.stars[V.id] = { s: "miss", d: today() };
        toast("Belum tepat, jadi tidak ada bintang. Baca penjelasannya.");
      }
      var lst = topicFacts(f.t); focusKey = lst.indexOf(f) < lst.length - 1 ? "next" : "done";
    },
    next: function () {
      var f = FACT_BY_ID[V.id], list = topicFacts(f.t), idx = list.indexOf(f);
      if (idx < list.length - 1) { V.id = list[idx + 1].id; V.step = "read"; V.why = false; V.picked = null; focusHeading = true; window.scrollTo(0, 0); }
    },
    reset: function () { V.confirmReset = true; focusKey = "reset-yes"; },
    "reset-no": function () { V.confirmReset = false; focusKey = "reset"; },
    "reset-yes": function () { S = { stars: {} }; V.confirmReset = false; toast("Kemajuan dihapus. Selamat berlayar lagi!"); }
  };

  function handle(el) {
    var fn = actions[el.dataset.act];
    if (!fn || el.disabled) return;
    if (!focusKey) focusKey = el.dataset.key || null;
    fn(el);
    save();
    renderAll();
  }
  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (el) { focusKey = el.dataset.key || null; handle(el); }
  });
  document.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("node")) {
      e.preventDefault();
      handle(e.target);
    }
  });

  renderAll();
})();
</script>

</body></html>
